<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9e9ef;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wh-scroll::-webkit-scrollbar{width:0;display:none}
  .wh-scroll{scrollbar-width:none}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;background:radial-gradient(120% 120% at 50% 0%,#f3f2f8 0%,#e6e5ee 100%)">
  <!-- PHONE -->
  <div style="width:411px;height:866px;background:#fff;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 40px 80px -24px rgba(60,50,120,.45),0 0 0 11px #0d0b1a,0 0 0 12px #2a2740;display:flex;flex-direction:column">

    <!-- STATUS BAR -->
    <div style="height:44px;flex:none;background:#6C5CE7;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;color:#fff;font-size:14px;font-weight:700;letter-spacing:.2px">
      <span style="font-family:'JetBrains Mono',monospace;font-weight:500">21:11</span>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px">
        <span style="opacity:.9">4G</span>
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#fff"/><rect x="5" y="4" width="3" height="8" rx="1" fill="#fff"/><rect x="10" y="1" width="3" height="11" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".4"/></svg>
        <div style="display:flex;align-items:center;gap:2px"><div style="width:22px;height:11px;border:1.5px solid rgba(255,255,255,.7);border-radius:3px;padding:1.5px;display:flex"><div style="width:60%;background:#fff;border-radius:1px"></div></div><span style="font-weight:600">91</span></div>
      </div>
    </div>

    <!-- HEADER -->
    <div style="flex:none;background:linear-gradient(135deg,#6C5CE7 0%,#5A4FD4 100%);padding:6px 18px 18px;color:#fff">
      <div style="display:flex;align-items:center;gap:14px">
        <button style="width:38px;height:38px;border:none;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div style="flex:1">
          <div style="font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.7">WorkHub</div>
          <div style="font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1">Mesazhe</div>
        </div>
        <button style="width:40px;height:40px;border:none;border-radius:13px;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer;position:relative">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span style="position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:#FF5C7A;border:2px solid #6356da"></span>
        </button>
        <div style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:700;font-size:15px;border:1.5px solid rgba(255,255,255,.35)">A</div>
      </div>

      <!-- SEARCH (unified) -->
      <div style="margin-top:16px;height:46px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);border-radius:14px;display:flex;align-items:center;gap:11px;padding:0 15px;backdrop-filter:blur(8px)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span style="color:rgba(255,255,255,.78);font-size:15px;font-weight:500">Kërko bisedë, klient ose person…</span>
      </div>
    </div>

    <!-- FILTER CHIPS -->
    <div class="wh-scroll" style="flex:none;display:flex;gap:8px;padding:14px 18px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid #f0eff5">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
        <button onClick="{{ f.onClick }}" style="{{ f.style }}">
          <sc-if value="{{ f.alert }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;border-radius:50%;background:#E8943A;display:inline-block"></span></sc-if>
          <span>{{ f.label }}</span>
          <sc-if value="{{ f.count }}" hint-placeholder-val="{{ false }}"><span style="{{ f.countStyle }}">{{ f.count }}</span></sc-if>
        </button>
      </sc-for>
    </div>

    <!-- UNIFIED CHAT LIST -->
    <div class="wh-scroll" style="flex:1;overflow-y:auto;background:#fff">

      <!-- pinned label -->
      <sc-if value="{{ showPinned }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;gap:6px;padding:13px 18px 4px;font-size:11.5px;font-weight:700;letter-spacing:.1em;color:#b0acc0">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="#b0acc0"><path d="M16 4v6l3 4v2H5v-2l3-4V4z" /></svg>TË FIKSUARA
        </div>
      </sc-if>

      <sc-for list="{{ chats }}" as="c" hint-placeholder-count="9">
        <div style="{{ c.wrapStyle }}">
          <!-- section divider label between pinned and rest -->
          <sc-if value="{{ c.startRest }}" hint-placeholder-val="{{ false }}">
            <div style="padding:14px 18px 4px;font-size:11.5px;font-weight:700;letter-spacing:.1em;color:#b0acc0">TË GJITHA BISEDAT</div>
          </sc-if>
          <div onClick="{{ c.onClick }}" style="display:flex;align-items:stretch;padding-left:16px;cursor:pointer" style-hover="background:#faf9fd">
            <div style="display:flex;align-items:center;padding:9px 0">
              <div style="position:relative;flex:none">
                <div style="{{ c.avStyle }}" innerHTML="{{ c.avInner }}"></div>
                <sc-if value="{{ c.online }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;bottom:1px;right:1px;width:13px;height:13px;border-radius:50%;background:#3FCB7E;border:2.5px solid #fff"></span></sc-if>
                <sc-if value="{{ c.pinned }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:-2px;right:-2px;width:20px;height:20px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(40,30,80,.18)"><svg width="11" height="11" viewBox="0 0 24 24" fill="#8a7df0"><path d="M16 4v6l3 4v2H5v-2l3-4V4z"/></svg></span></sc-if>
              </div>
            </div>
            <div style="{{ c.bodyStyle }}">
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:7px">
                  <span style="font-size:15.5px;font-weight:700;color:#1c1733;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.name }}</span>
                  <sc-if value="{{ c.tag }}" hint-placeholder-val="{{ false }}"><span style="{{ c.tagStyle }}">{{ c.tag }}</span></sc-if>
                </div>
                <div style="display:flex;align-items:center;gap:5px;margin-top:3px;min-width:0">
                  <sc-if value="{{ c.unassigned }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" style="flex:none" viewBox="0 0 24 24" fill="none" stroke="#E8943A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 2.4 18a1.9 1.9 0 0 0 1.7 2.9h15.8a1.9 1.9 0 0 0 1.7-2.9L13.7 3.9a1.9 1.9 0 0 0-3.4 0Z"/></svg></sc-if>
                  <span style="{{ c.previewStyle }}">{{ c.preview }}</span>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;padding-left:10px">
                <span style="{{ c.timeStyle }}">{{ c.time }}</span>
                <sc-if value="{{ c.unread }}" hint-placeholder-val="{{ false }}"><span style="min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#6C5CE7;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center">{{ c.unread }}</span></sc-if>
              </div>
            </div>
          </div>
        </div>
      </sc-for>
      <div style="height:96px"></div>
    </div>

    <!-- FAB -->
    <button style="position:absolute;right:18px;bottom:96px;width:58px;height:58px;border:none;border-radius:20px;background:linear-gradient(135deg,#7B5CF0,#6C5CE7);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 28px -6px rgba(108,92,231,.7)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 19H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M18 15v6M15 18h6"/></svg>
    </button>

    <!-- BOTTOM NAV -->
    <div style="flex:none;height:78px;background:#fff;border-top:1px solid #f0eff5;display:flex;align-items:flex-start;padding:11px 6px 0;box-shadow:0 -4px 20px -10px rgba(40,30,80,.12)">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <button style="flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;position:relative;padding-top:2px">
          <div style="position:relative" innerHTML="{{ n.icon }}"></div>
          <sc-if value="{{ n.badge }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:-3px;left:50%;margin-left:5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#FF5C7A;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid #fff">{{ n.badge }}</span></sc-if>
          <span style="{{ n.labelStyle }}">{{ n.label }}</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: 'all' };

  chip(key, label, count, alert) {
    const active = this.state.filter === key;
    const base = "display:flex;align-items:center;gap:7px;flex:none;height:36px;padding:0 16px;border-radius:18px;font-size:13.5px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all .15s;border:1px solid ";
    const style = active
      ? base + "transparent;background:#6C5CE7;color:#fff"
      : base + "#e8e6f0;background:#fff;color:#6a6680";
    const countStyle = active
      ? "background:rgba(255,255,255,.28);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px"
      : "background:#f0eff5;color:#8a869c;font-size:11px;padding:1px 7px;border-radius:10px";
    return { label, count, alert, style, countStyle, onClick: () => this.setState({ filter: key }) };
  }

  navIcon(path, active) {
    const c = active ? '#6C5CE7' : '#a8a4b8';
    return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
  }

  // avatar markup
  initialAv(bg, fg, text) {
    return {
      avStyle: `width:48px;height:48px;flex:none;border-radius:50%;background:${bg};color:${fg};display:grid;place-items:center;font-size:15px;font-weight:700`,
      avInner: text,
    };
  }
  aiAv() {
    return {
      avStyle: 'width:48px;height:48px;flex:none;border-radius:50%;background:linear-gradient(135deg,#7B5CF0,#9D6BF5);display:grid;place-items:center;box-shadow:0 5px 14px -4px rgba(123,92,240,.6)',
      avInner: '<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5l1.9 4.8 4.8 1.9-4.8 1.9L12 16l-1.9-4.9L5.3 9.2l4.8-1.9L12 2.5z"/><circle cx="18.5" cy="17.5" r="2.1"/><circle cx="6" cy="18" r="1.4"/></svg>',
    };
  }
  groupAv() {
    return {
      avStyle: 'width:48px;height:48px;flex:none;border-radius:50%;background:#ece8fb;display:grid;place-items:center',
      avInner: '<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#6C5CE7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 19a4 4 0 0 0-8 0"/><circle cx="12" cy="9" r="3"/><path d="M5 19a3.5 3.5 0 0 1 4-3.2M19 19a3.5 3.5 0 0 0-4-3.2"/></svg>',
    };
  }

  tagStyle(bg, fg) {
    return `flex:none;font-size:10px;font-weight:700;letter-spacing:.04em;color:${fg};background:${bg};padding:2px 8px;border-radius:8px;text-transform:uppercase`;
  }

  renderVals() {
    const f = this.state.filter;

    // unified conversation model
    const all = [
      { type: 'ai', pinned: true, name: 'FivoAI', tag: 'AI', tagBg: '#ece6ff', tagFg: '#7B5CF0', preview: 'Asistenti juaj personal', time: '', av: this.aiAv() },
      { type: 'group', pinned: true, name: 'Web Design Seo', tag: 'Grup', tagBg: '#ece8fb', tagFg: '#6C5CE7', preview: 'Andi: e ngarkova faqen e re', time: '14:02', unread: '2', av: this.groupAv() },

      { type: 'staff', name: 'Enkeleda Kanina', preview: 'Ti: hello', time: '15:30', unread: '1', online: true, av: this.initialAv('#d8f0e6', '#2f8d70', 'EN') },
      { type: 'client', name: 'best-landscapes.co.uk', tag: 'Klient', tagBg: '#e0f1f4', tagFg: '#2f8da0', unassigned: true, preview: 'Pa përgjegjës', time: 'Dje', av: this.initialAv('#e3f3ea', '#3a9e69', 'B') },
      { type: 'staff', name: 'Emanuela Kapllani', preview: 'Ti: Ela mund te besh nje test te me cosh nje imazh', time: 'Dje', online: true, av: this.initialAv('#d8f0e6', '#2f8d70', 'EM') },
      { type: 'staff', name: 'Elton Heta', preview: 'edhe me citime ne ai direkt', time: 'Dje', av: this.initialAv('#fbe7cf', '#d98a2b', 'EL') },
      { type: 'client', name: 'Taxi Spartak', tag: 'Klient', tagBg: '#e0f1f4', tagFg: '#2f8da0', unassigned: true, preview: 'Pa përgjegjës', time: 'mër', av: this.initialAv('#e0f1f4', '#2f8da0', 'T') },
      { type: 'client', name: 'Arta Progonati', tag: 'Klient', tagBg: '#e0f1f4', tagFg: '#2f8da0', preview: 'Ti: e zgjidha problemin', time: 'mër', av: this.initialAv('#e3f3ea', '#3a9e69', 'A') },
      { type: 'client', name: 'Rent Car Albania', tag: 'Klient', tagBg: '#e0f1f4', tagFg: '#2f8da0', unassigned: true, preview: 'Pa përgjegjës', time: 'mër', av: this.initialAv('#fbeede', '#c77a1e', 'R') },
      { type: 'staff', name: 'Tomas Monka', preview: 'Po', time: 'mër', av: this.initialAv('#dde6fb', '#3f63d9', 'TO') },
      { type: 'staff', name: 'User 6Xj8DA', preview: 'test', time: 'mër', av: this.initialAv('#d8f0e6', '#2f8d70', 'US') },
    ];

    let list = all;
    if (f === 'unassigned') list = all.filter(c => c.unassigned);
    else if (f === 'clients') list = all.filter(c => c.type === 'client');
    else if (f === 'groups') list = all.filter(c => c.type === 'group');
    else if (f === 'staff') list = all.filter(c => c.type === 'staff');

    const showPinned = f === 'all';
    let restStarted = false;

    const chats = list.map((c, i) => {
      const isFirst = i === 0;
      let startRest = false;
      if (showPinned && !c.pinned && !restStarted) { startRest = true; restStarted = true; }
      // divider: indented hairline above body, except very first row and the row that starts a new labelled section
      const drawDivider = !isFirst && !startRest;
      return {
        ...c,
        ...c.av,
        startRest,
        wrapStyle: 'background:#fff',
        bodyStyle: `flex:1;min-width:0;display:flex;align-items:center;padding:12px 16px 12px 12px;margin-left:0;${drawDivider ? 'border-top:1px solid #f3f2f8;' : ''}`,
        tagStyle: c.tag ? this.tagStyle(c.tagBg, c.tagFg) : '',
        previewStyle: 'font-size:13.5px;font-weight:' + (c.unassigned ? '700' : '500') + ';color:' + (c.unassigned ? '#C77A1E' : (c.unread ? '#5a5670' : '#8a869c')) + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis',
        timeStyle: 'font-size:11.5px;font-weight:' + (c.unread ? '700' : '500') + ';color:' + (c.unread ? '#6C5CE7' : '#b3afc2'),
        onClick: () => {},
      };
    });

    return {
      filters: [
        this.chip('all', 'Të gjitha', null, false),
        this.chip('unassigned', 'Pa përgjegjës', '3', true),
        this.chip('clients', 'Klientë', null, false),
        this.chip('groups', 'Grupe', null, false),
        this.chip('staff', 'Staf', null, false),
      ],
      showPinned,
      chats,
      nav: [
        { label: 'Home', labelStyle: 'font-size:11px;font-weight:600;color:#a8a4b8', icon: this.navIcon('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>', false) },
        { label: 'Detyrat', labelStyle: 'font-size:11px;font-weight:600;color:#a8a4b8', icon: this.navIcon('<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>', false) },
        { label: 'Chat', labelStyle: 'font-size:11px;font-weight:700;color:#6C5CE7', badge: '4', icon: this.navIcon('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>', true) },
        { label: 'Klientët', labelStyle: 'font-size:11px;font-weight:600;color:#a8a4b8', icon: this.navIcon('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>', false) },
        { label: 'Më shumë', labelStyle: 'font-size:11px;font-weight:600;color:#a8a4b8', icon: this.navIcon('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>', false) },
      ],
    };
  }
}
</script>
</body>
</html>
