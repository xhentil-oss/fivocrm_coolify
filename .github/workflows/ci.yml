name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: actions/setup-node@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # The root tsconfig.json is a SOLUTION file ("files": [] + references), so a
      # bare `tsc --noEmit` checks nothing and exits 0. api/ must stay at 0 errors;
      # the app has a known backlog, so it is reported but not (yet) enforced.
      - name: Type-check (api — must be clean)
        run: npm run typecheck:api

      - name: Type-check (app — report only)
        run: npm run typecheck || true

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit found high/critical issues"

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
